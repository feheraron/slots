name: slots

# Host ports can be overridden from the environment or an .env file
services:
  postgres:
    image: postgres:18.6
    command: >-
      postgres
      -c max_connections=50
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=7864kB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=5461kB
      -c huge_pages=off
      -c jit=off
      -c wal_compression=lz4
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
    shm_size: 256mb
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_DB: slots
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slots"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/slots
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JAVA_TOOL_OPTIONS: >-
        -Xms1536m -Xmx1536m
        -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=64m
        -XX:ReservedCodeCacheSize=256m
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.2
    entrypoint:
      - sh
      - -c
      - grafana cli --homepath /usr/share/grafana admin reset-admin-password admin > /dev/null 2>&1 || true; exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/slots-service.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:
